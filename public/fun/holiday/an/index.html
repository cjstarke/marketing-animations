<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>The Annuity Eagle: Rate Escape!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: linear-gradient(180deg, #88B5D3 0%, #C8DCE8 100%);
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            background: linear-gradient(180deg, #88B5D3 0%, #C8DCE8 100%);
        }
        
        /* Snowflake animation */
        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1em;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
            text-shadow: 0 0 5px rgba(255,255,255,0.8);
        }
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
        
        #snowContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        #gameOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background: linear-gradient(180deg, #2c5f7f 0%, #3d7fa8 50%, #5ba3d0 100%);
            color: white;
            font-size: 24px;
            z-index: 10;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        #gameOverlay.hidden {
            display: none;
        }
        .title-screen {
            text-align: center;
            animation: fadeIn 1s ease-in;
            max-width: 90%;
            width: 100%;
            padding: 20px 0;
            margin: auto;
        }
        .main-logo {
            width: 100%;
            max-width: 600px;
            height: auto;
            margin: 20px auto 30px;
            filter: drop-shadow(0 10px 30px rgba(255,255,255,0.3));
            animation: float 3s ease-in-out infinite;
        }
        .game-instructions {
            background: rgba(255,255,255,0.15);
            border: 3px solid #B8E0F6;
            border-radius: 15px;
            padding: 25px 40px;
            margin: 20px auto;
            backdrop-filter: blur(10px);
            max-width: 500px;
        }
        .game-instructions p {
            margin: 12px 0;
            font-size: 18px;
            color: #FFF;
            text-align: center;
        }
        #startButton, #restartButton {
            margin-top: 20px;
            padding: 20px 60px;
            font-size: 28px;
            background: linear-gradient(180deg, #4a9fd8 0%, #2a7fb8 100%);
            color: white;
            border: 4px solid #FFF;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #1a5f88, 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.1s;
            animation: buttonGlow 1.5s infinite;
        }
        #startButton:hover, #restartButton:hover {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #1a5f88, 0 7px 15px rgba(0,0,0,0.3);
        }
        #startButton:active, #restartButton:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #1a5f88, 0 4px 10px rgba(0,0,0,0.3);
        }
        .powered-by-section {
            margin-top: 30px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .powered-by-section img {
            width: 250px;
            height: auto;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        #scoreBoard {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #FFF;
            background: rgba(42,127,184,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            border: 3px solid #B8E0F6;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 5;
            text-align: left;
        }
        #scoreBoard div {
            margin: 5px 0;
        }
        #gameLogo {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 5;
            background: rgba(42,127,184,0.7);
            padding: 8px 12px;
            border-radius: 10px;
            border: 3px solid #B8E0F6;
        }
        #gameLogo img {
            height: 50px;
            width: auto;
            display: block;
        }
        #poweredBy {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 5;
            background: rgba(255,255,255,0.3);
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }
        #poweredBy img {
            width: 140px;
            height: auto;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        #muteButton {
            position: absolute;
            top: 20px;
            left: 180px;
            z-index: 5;
            background: rgba(42,127,184,0.7);
            padding: 10px 15px;
            border-radius: 10px;
            border: 3px solid #B8E0F6;
            cursor: pointer;
            font-size: 24px;
            transition: transform 0.1s;
            user-select: none;
        }
        #muteButton:hover {
            transform: scale(1.1);
        }
        #muteButton:active {
            transform: scale(0.95);
        }
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #2c5f7f 0%, #3d7fa8 50%, #5ba3d0 100%);
            color: #FFF;
            font-size: 28px;
            font-weight: bold;
            z-index: 20;
        }
        #loadingScreen.hidden {
            display: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        @keyframes buttonGlow {
            0%, 100% { box-shadow: 0 6px 0 #1a5f88, 0 10px 20px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 6px 0 #1a5f88, 0 10px 30px rgba(74,159,216,0.6); }
        }
        .coin-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            background: #FFD700;
            border-radius: 50%;
            border: 2px solid #FFA500;
            vertical-align: middle;
            margin: 0 5px;
        }
        .person-icon {
            display: inline-block;
            font-size: 20px;
            vertical-align: middle;
            margin: 0 5px;
        }
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        @media (max-width: 768px) {
            #gameOverlay {
                padding: 15px;
            }
            .title-screen {
                padding: 10px 0;
            }
            .main-logo {
                max-width: 85%;
                margin: 15px auto 25px;
            }
            .game-instructions {
                padding: 20px 25px;
                font-size: 16px;
            }
            #startButton, #restartButton {
                padding: 15px 40px;
                font-size: 22px;
                margin-top: 15px;
            }
            .powered-by-section {
                margin-top: 25px;
                margin-bottom: 25px;
            }
            .powered-by-section img {
                width: 180px;
            }
            #poweredBy img {
                width: 100px;
            }
            #muteButton {
                left: 20px;
                top: 85px;
            }
            #scoreBoard {
                font-size: 16px;
                padding: 10px 15px;
            }
        }
        
        @media (max-height: 800px) {
            .main-logo {
                max-width: 450px;
                margin: 15px auto 20px;
            }
            .game-instructions {
                padding: 18px 30px;
                margin: 15px auto;
            }
            .game-instructions p {
                margin: 10px 0;
                font-size: 16px;
            }
            #startButton, #restartButton {
                padding: 15px 50px;
                font-size: 24px;
                margin-top: 15px;
            }
            .powered-by-section {
                margin-top: 20px;
                margin-bottom: 20px;
            }
            .powered-by-section img {
                width: 200px;
            }
        }
        
        @media (max-height: 650px) {
            .main-logo {
                max-width: 350px;
                margin: 10px auto 15px;
            }
            .game-instructions {
                padding: 15px 25px;
                margin: 12px auto;
            }
            .game-instructions p {
                margin: 8px 0;
                font-size: 15px;
            }
            #startButton, #restartButton {
                padding: 12px 40px;
                font-size: 20px;
                margin-top: 12px;
            }
            .powered-by-section {
                margin-top: 15px;
                margin-bottom: 15px;
            }
            .powered-by-section img {
                width: 160px;
            }
        }
    </style>
</head>
<body>
    <div id="snowContainer"></div>
    
    <div id="loadingScreen">
        <div>
            <div style="text-align: center;">
                <div style="font-size: 48px; margin-bottom: 20px;">🦅</div>
                <div>LOADING ASSETS...</div>
                <div style="font-size: 16px; margin-top: 10px; color: #B8E0F6;">Preparing your flight...</div>
            </div>
        </div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="scoreBoard" style="display: none;">
        <div>💰 Coins: <span id="coinCount">0</span></div>
        <div>👤 Investors: <span id="investorCount">0</span></div>
    </div>
    
    <div id="gameLogo" style="display: none;">
        <img src="https://i.postimg.cc/dL1P5Y6Y/Eagle.png" alt="Eagle Logo">
    </div>
    
    <div id="muteButton" style="display: none;">🔊</div>
    
    <div id="poweredBy" style="display: none;">
        <img src="https://i.postimg.cc/qRpg7WBD/HH-Converge-green.png" alt="Happiest Holidays from Converge">
    </div>
    
    <div id="gameOverlay" class="hidden">
        <div class="stars" id="starField"></div>
        <div class="title-screen">
            <img src="https://i.postimg.cc/fTSdH9Fj/Gemini-Generated-Image-oqmvuoqmvuoqmvuo.png" 
                 alt="The Annuity Eagle: Rate Escape!" 
                 class="main-logo">
            
            <div class="game-instructions">
                <p>🎮 <strong>TAP or CLICK</strong> to fly up!</p>
                <p><span class="coin-icon"></span> Collect <strong>CONVERGE COINS</strong></p>
                <p><span class="person-icon">👤</span> Sign up <strong>DIY INVESTORS</strong></p>
                <p>📈 Navigate <strong>RATE HIKES</strong> & <strong>DROPS</strong></p>
            </div>
            
            <button id="startButton">🚀 START GAME 🚀</button>
            
            <div class="powered-by-section">
                <img src="https://i.postimg.cc/mgmqPHS6/hhconverge.png" alt="Happiest Holidays from Converge">
            </div>
        </div>
    </div>

    <script>
        // ==================== AUDIO SYSTEM (SAFARI COMPATIBLE) ====================
        let backgroundMusic = null;
        let isMuted = false;
        let audioContext = null;
        let audioUnlocked = false;
        let musicReady = false;

        function initAudio() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContextClass();
                console.log('Audio context created, state:', audioContext.state);
            } catch (e) {
                console.error('Failed to create audio context:', e);
            }
            
            backgroundMusic = new Audio();
            backgroundMusic.src = 'https://files.catbox.moe/5s12re.mp3';
            backgroundMusic.loop = true;
            backgroundMusic.volume = 0.4;
            backgroundMusic.preload = 'none';
            backgroundMusic.setAttribute('playsinline', 'true');
            backgroundMusic.setAttribute('webkit-playsinline', 'true');
            
            backgroundMusic.addEventListener('canplaythrough', () => {
                console.log('✓ Music can play through');
                musicReady = true;
            });
            
            backgroundMusic.addEventListener('loadeddata', () => {
                console.log('✓ Music data loaded');
                musicReady = true;
            });
            
            backgroundMusic.addEventListener('canplay', () => {
                console.log('✓ Music can play');
                musicReady = true;
            });
            
            backgroundMusic.load();
            console.log('Background music element created and loading...');
        }

        function unlockAudio() {
            if (audioUnlocked) {
                console.log('Audio already unlocked');
                return Promise.resolve(true);
            }
            
            console.log('=== Starting audio unlock sequence ===');
            const promises = [];
            
            if (audioContext && audioContext.state === 'suspended') {
                console.log('Resuming audio context...');
                promises.push(
                    audioContext.resume().then(() => {
                        console.log('✓ Audio context resumed, state:', audioContext.state);
                    }).catch(err => {
                        console.error('✗ Failed to resume:', err);
                    })
                );
            }
            
            if (backgroundMusic) {
                const originalVolume = backgroundMusic.volume;
                backgroundMusic.volume = 0.01;
                backgroundMusic.currentTime = 0;
                
                const musicPromise = backgroundMusic.play().then(() => {
                    console.log('✓ Unlock play successful');
                    
                    return new Promise((resolve) => {
                        setTimeout(() => {
                            backgroundMusic.pause();
                            backgroundMusic.currentTime = 0;
                            backgroundMusic.volume = originalVolume;
                            console.log('✓ Music unlocked and reset');
                            resolve(true);
                        }, 100);
                    });
                    
                }).catch(err => {
                    console.log('✗ Unlock play failed:', err.name, err.message);
                    backgroundMusic.volume = originalVolume;
                    return false;
                });
                
                promises.push(musicPromise);
            }
            
            return Promise.all(promises).then((results) => {
                audioUnlocked = true;
                console.log('=== Audio unlock complete ===');
                return true;
            });
        }

        function stopBackgroundMusic() {
            if (backgroundMusic) {
                console.log('Stopping background music');
                backgroundMusic.pause();
                backgroundMusic.currentTime = 0;
            }
        }

        function playCoinSound() {
            if (isMuted || !audioContext || !audioUnlocked) return;
            
            try {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {
                console.error('Error playing coin sound:', e);
            }
        }

        function playInvestorSound() {
            if (isMuted || !audioContext || !audioUnlocked) return;
            
            try {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(783.99, audioContext.currentTime + 0.15);
                
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } catch (e) {
                console.error('Error playing investor sound:', e);
            }
        }

        function playGameOverSound() {
            if (isMuted || !audioContext || !audioUnlocked) return;
            
            try {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.5);
                
                gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {
                console.error('Error playing game over sound:', e);
            }
        }

        initAudio();

        // ==================== SNOWFALL EFFECT ====================
        function createSnowfall() {
            const snowContainer = document.getElementById('snowContainer');
            const numberOfFlakes = 50;
            
            for (let i = 0; i < numberOfFlakes; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = '❄';
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 3 + 5) + 's';
                snowflake.style.animationDelay = Math.random() * 5 + 's';
                snowflake.style.fontSize = (Math.random() * 0.5 + 0.5) + 'em';
                snowflake.style.opacity = Math.random() * 0.6 + 0.4;
                snowContainer.appendChild(snowflake);
            }
        }
        createSnowfall();

        function createStarField() {
            const starField = document.getElementById('starField');
            if (!starField) return;
            
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starField.appendChild(star);
            }
        }
        createStarField();

        // ==================== CANVAS SETUP ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('gameOverlay');
        const startButton = document.getElementById('startButton');
        const scoreBoard = document.getElementById('scoreBoard');
        const coinCountDisplay = document.getElementById('coinCount');
        const investorCountDisplay = document.getElementById('investorCount');
        const loadingScreen = document.getElementById('loadingScreen');
        const gameLogo = document.getElementById('gameLogo');
        const poweredBy = document.getElementById('poweredBy');
        const muteButton = document.getElementById('muteButton');

        let WIDTH, HEIGHT;

        function resizeCanvas() {
            WIDTH = window.innerWidth;
            HEIGHT = window.innerHeight;
            canvas.width = WIDTH;
            canvas.height = HEIGHT;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ==================== CANVAS SNOW PARTICLES ====================
        const snowParticles = [];
        
        class SnowParticle {
            constructor() {
                this.x = Math.random() * WIDTH;
                this.y = Math.random() * HEIGHT - HEIGHT;
                this.radius = Math.random() * 2 + 1;
                this.speedY = Math.random() * 1 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.6 + 0.4;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                if (this.y > HEIGHT) {
                    this.y = -10;
                    this.x = Math.random() * WIDTH;
                }

                if (this.x > WIDTH) {
                    this.x = 0;
                } else if (this.x < 0) {
                    this.x = WIDTH;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) {
            snowParticles.push(new SnowParticle());
        }

        // ==================== IMAGE LOADING ====================
        const images = {
            eagle: null,
            convergeC: null,
            convergeLogo: null,
            mainLogo: null,
            eagleLogo: null,
            hikeSign: null,
            dropSign: null
        };

        let imagesLoaded = 0;
        const totalImages = 6;

        function loadImage(key, src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    images[key] = img;
                    imagesLoaded++;
                    console.log(`Loaded ${key} (${imagesLoaded}/${totalImages})`);
                    resolve();
                };
                img.onerror = () => {
                    console.error(`Failed to load image: ${src}`);
                    reject();
                };
                img.src = src;
            });
        }

        Promise.all([
            loadImage('eagle', 'https://i.postimg.cc/T3Vh5qLs/aneagle.png'),
            loadImage('convergeC', 'https://i.postimg.cc/5jzYRBkr/convergec.png'),
            loadImage('mainLogo', 'https://i.postimg.cc/fTSdH9Fj/Gemini-Generated-Image-oqmvuoqmvuoqmvuo.png'),
            loadImage('eagleLogo', 'https://i.postimg.cc/dL1P5Y6Y/Eagle.png'),
            loadImage('hikeSign', 'https://i.postimg.cc/kR4bLSkk/Hike.png'),
            loadImage('dropSign', 'https://i.postimg.cc/MXKVckvj/Drop.png')
        ]).then(() => {
            console.log('All images loaded successfully!');
            loadingScreen.classList.add('hidden');
            overlay.classList.remove('hidden');
        }).catch((error) => {
            console.error('Error loading images:', error);
            loadingScreen.innerHTML = '<div style="text-align:center;"><div style="font-size:48px;margin-bottom:20px;">⚠️</div><div>Error loading assets</div><div style="font-size:16px;margin-top:10px;">Please refresh the page</div></div>';
        });

        // ==================== GAME STATE ====================
        let gameStarted = false;
        let gameOver = false;
        let coinCount = 0;
        let investorCount = 0;
        let isFlying = false;

        function updateScoreDisplay() {
            coinCountDisplay.textContent = coinCount;
            investorCountDisplay.textContent = investorCount;
        }

        // ==================== EAGLE OBJECT ====================
        const eagle = {
            x: WIDTH * 0.15,
            y: HEIGHT / 2,
            width: 70,
            height: 55,
            velocity: 0,
            gravity: 0.35,
            lift: -8,
            rotation: 0,
            maxVelocity: 8,
            
            update() {
                if (isFlying) {
                    this.velocity += this.lift * 0.1;
                }
                this.velocity += this.gravity;
                
                this.velocity = Math.max(-this.maxVelocity, Math.min(this.maxVelocity, this.velocity));
                
                this.velocity *= 0.97;
                this.y += this.velocity;

                this.rotation = Math.min(Math.max(this.velocity * 2, -25), 25);

                if (this.y - this.height / 2 < 0) {
                    this.y = this.height / 2;
                    this.velocity = 0;
                    endGame();
                }

                if (this.checkTerrainCollision()) {
                    endGame();
                }
            },

            checkTerrainCollision() {
                const eagleBottom = this.y + this.height / 2;
                const eagleTop = this.y - this.height / 2;
                const eagleLeft = this.x - this.width / 2;
                const eagleRight = this.x + this.width / 2;
                
                const checkPoints = [
                    { x: eagleLeft, y: eagleBottom },
                    { x: this.x, y: eagleBottom },
                    { x: eagleRight, y: eagleBottom },
                ];

                for (let point of checkPoints) {
                    for (let i = 0; i < terrain.points.length - 1; i++) {
                        const p1 = terrain.points[i];
                        const p2 = terrain.points[i + 1];
                        
                        if (point.x >= p1.x && point.x <= p2.x) {
                            const terrainHeight = p1.y + (p2.y - p1.y) * ((point.x - p1.x) / (p2.x - p1.x));
                            if (point.y >= terrainHeight) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            },

            draw() {
                if (!images.eagle) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);

                ctx.drawImage(
                    images.eagle,
                    -this.width / 2,
                    -this.height / 2,
                    this.width,
                    this.height
                );

                ctx.restore();
            }
        };

        // ==================== WARNING SIGNS ====================
        const warningSigns = [];

        class WarningSign {
            constructor(x, terrainY, isHike) {
                this.x = x;
                this.terrainY = terrainY;
                this.isHike = isHike;
                this.width = 100;
                this.height = 100;
            }

            update() {
                this.x -= terrain.speed;
                
                let closestPoint = terrain.points[0];
                let minDistance = Math.abs(this.x - closestPoint.x);
                
                for (let point of terrain.points) {
                    const distance = Math.abs(this.x - point.x);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestPoint = point;
                    }
                }
                
                this.terrainY = closestPoint.y;
            }

            draw() {
                const image = this.isHike ? images.hikeSign : images.dropSign;
                if (!image) return;

                ctx.save();
                
                const signY = this.terrainY - this.height + 20;
                
                ctx.drawImage(
                    image,
                    this.x - this.width / 2,
                    signY,
                    this.width,
                    this.height
                );
                
                ctx.restore();
            }

            isOffScreen() {
                return this.x < -this.width;
            }
        }

        // ==================== TERRAIN ====================
        const terrain = {
            points: [],
            speed: 2.5,
            segmentWidth: 20,
            baseHeight: HEIGHT * 0.70,
            volatility: 50,
            maxHeight: HEIGHT * 0.45,
            minHeight: HEIGHT * 0.85,
            currentTrend: 'neutral',
            trendStrength: 0,
            trendCounter: 0,
            lastSignSpawn: 0,

            init() {
                this.points = [];
                this.baseHeight = HEIGHT * 0.70;
                this.maxHeight = HEIGHT * 0.45;
                this.minHeight = HEIGHT * 0.85;
                this.currentTrend = 'neutral';
                this.trendStrength = 0;
                this.trendCounter = 0;
                this.lastSignSpawn = 0;
                
                let currentY = this.baseHeight;
                
                for (let x = 0; x <= WIDTH + this.segmentWidth; x += this.segmentWidth) {
                    this.points.push({
                        x: x,
                        y: currentY
                    });
                }
            },

            update() {
                for (let point of this.points) {
                    point.x -= this.speed;
                }

                while (this.points.length > 0 && this.points[0].x < -this.segmentWidth) {
                    this.points.shift();
                }

                this.trendCounter++;
                
                if (this.trendCounter > 120) {
                    const rand = Math.random();
                    if (rand < 0.4) {
                        this.currentTrend = 'up';
                        this.trendStrength = 30;
                    } else if (rand < 0.8) {
                        this.currentTrend = 'down';
                        this.trendStrength = 30;
                    } else {
                        this.currentTrend = 'neutral';
                        this.trendStrength = 0;
                    }
                    this.trendCounter = 0;
                    
                    if (this.currentTrend !== 'neutral') {
                        const futureX = WIDTH + 150;
                        const futureY = this.points[this.points.length - 1].y;
                        warningSigns.push(new WarningSign(futureX, futureY, this.currentTrend === 'up'));
                        this.lastSignSpawn = Date.now();
                    }
                }

                while (this.points[this.points.length - 1].x < WIDTH + this.segmentWidth) {
                    const lastPoint = this.points[this.points.length - 1];
                    
                    let changeAmount = 0;
                    
                    if (this.currentTrend === 'up') {
                        changeAmount = -this.trendStrength + (Math.random() * 10 - 5);
                    } else if (this.currentTrend === 'down') {
                        changeAmount = this.trendStrength + (Math.random() * 10 - 5);
                    } else {
                        changeAmount = (Math.random() - 0.5) * 15;
                    }
                    
                    let newY = lastPoint.y + changeAmount;
                    newY = Math.max(this.maxHeight, Math.min(this.minHeight, newY));
                    
                    this.points.push({
                        x: lastPoint.x + this.segmentWidth,
                        y: newY
                    });
                }
            },

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);
                
                for (let i = 1; i < this.points.length; i++) {
                    ctx.lineTo(this.points[i].x, this.points[i].y);
                }
                
                ctx.lineTo(WIDTH + 100, HEIGHT);
                ctx.lineTo(-100, HEIGHT);
                ctx.closePath();
                
                const snowGradient = ctx.createLinearGradient(0, this.points[0].y, 0, HEIGHT);
                snowGradient.addColorStop(0, '#FFFFFF');
                snowGradient.addColorStop(0.3, '#F5F5F5');
                snowGradient.addColorStop(1, '#E8E8E8');
                
                ctx.fillStyle = snowGradient;
                ctx.fill();
            }
        };

        // ==================== COINS ====================
        const coins = [];
        let coinSpawnTimer = 0;
        const coinSpawnInterval = 120;
        const existingCoinRows = [];

        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 25;
                this.collected = false;
                this.rotation = 0;
            }

            update() {
                this.x -= terrain.speed;
                this.rotation += 0.05;

                const dx = this.x - eagle.x;
                const dy = this.y - eagle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < this.radius + eagle.width / 3 && !this.collected) {
                    this.collected = true;
                    coinCount++;
                    
                    if (coinCount % 5 === 0) {
                        investorCount++;
                        playInvestorSound();
                    } else {
                        playCoinSound();
                    }
                    
                    updateScoreDisplay();
                }
            }

            draw() {
                if (this.collected || !images.convergeC) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#FFA500';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius - 3, 0, Math.PI * 2);
                ctx.stroke();

                const cSize = this.radius * 1.3;
                ctx.drawImage(
                    images.convergeC,
                    -cSize / 2,
                    -cSize / 2,
                    cSize,
                    cSize
                );

                ctx.restore();
            }

            isOffScreen() {
                return this.x < -50;
            }
        }

        function findNonOverlappingY() {
            const minSeparation = 80;
            const maxAttempts = 20;
            
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const candidateY = Math.random() * (HEIGHT * 0.35) + 80;
                let isValid = true;
                
                for (let existingY of existingCoinRows) {
                    if (Math.abs(candidateY - existingY) < minSeparation) {
                        isValid = false;
                        break;
                    }
                }
                
                if (isValid) {
                    return candidateY;
                }
            }
            
            return Math.random() * (HEIGHT * 0.35) + 80;
        }

        function spawnCoinRow() {
            const coinsInRow = Math.floor(Math.random() * 5) + 3;
            const spacing = 60;
            const startX = WIDTH + 50;
            
            const rowY = findNonOverlappingY();
            
            existingCoinRows.push(rowY);
            
            if (existingCoinRows.length > 3) {
                existingCoinRows.shift();
            }
            
            for (let i = 0; i < coinsInRow; i++) {
                coins.push(new Coin(startX + (i * spacing), rowY));
            }
        }

        // ==================== INPUT HANDLING ====================
        function handleFlyStart(e) {
            e.preventDefault();
            if (!gameStarted) return;
            isFlying = true;
        }

        function handleFlyEnd(e) {
            e.preventDefault();
            isFlying = false;
        }

        canvas.addEventListener('mousedown', handleFlyStart);
        canvas.addEventListener('mouseup', handleFlyEnd);
        canvas.addEventListener('mouseleave', handleFlyEnd);
        canvas.addEventListener('touchstart', handleFlyStart);
        canvas.addEventListener('touchend', handleFlyEnd);

        // ==================== GAME FUNCTIONS ====================
        function startGame() {
            console.log('Start game called');
            
            // Start game immediately without waiting for audio
            gameStarted = true;
            gameOver = false;
            coinCount = 0;
            investorCount = 0;
            updateScoreDisplay();
            
            scoreBoard.style.display = 'block';
            gameLogo.style.display = 'block';
            poweredBy.style.display = 'flex';
            muteButton.style.display = 'block';
            
            eagle.x = WIDTH * 0.15;
            eagle.y = HEIGHT * 0.30;
            eagle.velocity = 0;
            coins.length = 0;
            warningSigns.length = 0;
            existingCoinRows.length = 0;
            coinSpawnTimer = 0;
            terrain.init();
            overlay.classList.add('hidden');
            
            gameLoop();
            
            // Try to unlock and play audio in the background (non-blocking)
            if (!isMuted) {
                unlockAudio().then(() => {
                    console.log('Audio unlocked, attempting to play music...');
                    if (backgroundMusic && gameStarted) {
                        backgroundMusic.load(); // Explicitly load the audio now
                        backgroundMusic.loop = true;
                        backgroundMusic.volume = 0.4;
                        backgroundMusic.play().then(() => {
                            console.log('✓ Music playing!');
                        }).catch(err => {
                            console.log('Music play failed (may load in background):', err.message);
                        });
                    }
                }).catch(err => {
                    console.log('Audio unlock skipped:', err.message);
                });
            }
        }

        function endGame() {
    if (gameOver) return;
    gameOver = true;
    gameStarted = false;
    
    stopBackgroundMusic();
    playGameOverSound();

    overlay.innerHTML = `
        <div class="stars" id="starFieldGameOver"></div>
        <div class="title-screen">
            <img src="https://i.postimg.cc/fTSdH9Fj/Gemini-Generated-Image-oqmvuoqmvuoqmvuo.png" 
                 alt="The Annuity Eagle: Rate Escape!" 
                 class="main-logo"
                 style="max-width: 400px; margin-bottom: 30px;">
            
            <div style="background: rgba(255,255,255,0.1); border: 3px solid #B8E0F6; border-radius: 15px; padding: 30px; backdrop-filter: blur(10px);">
                <div style="font-size: 42px; font-weight: bold; color: #4ECDC4; margin-bottom: 20px;">GAME OVER!</div>
                <div style="font-size: 18px; color: #FFF; margin-bottom: 20px; font-style: italic;">
                    Don't worry, working with Converge will be easier and less frustrating than some silly game.
                </div>
                <div style="font-size: 24px; color: #FFD700; margin: 15px 0;">
                    💰 Converge Coins: <strong>${coinCount}</strong>
                </div>
                <div style="font-size: 24px; color: #4ECDC4; margin: 15px 0;">
                    👤 DIY Investors: <strong>${investorCount}</strong>
                </div>
                <div style="font-size: 20px; color: #FFF; margin: 20px 0;">
                    ${investorCount === 0 ? '🥉 Keep practicing, Eagle!' : 
                      investorCount < 5 ? '🥈 Good flight, Eagle!' : 
                      investorCount < 10 ? '🥇 Excellent navigation!' : 
                      '🏆 LEGENDARY EAGLE! 🏆'}
                </div>
            </div>
            
            <button id="restartButton">🔄 TRY AGAIN 🔄</button>
            
            <div class="powered-by-section">
                <img src="https://i.postimg.cc/mgmqPHS6/hhconverge.png" alt="Happiest Holidays from Converge">
            </div>
        </div>
    `;
    
    const starFieldGameOver = document.getElementById('starFieldGameOver');
    if (starFieldGameOver) {
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starFieldGameOver.appendChild(star);
        }
    }
    
    overlay.classList.remove('hidden');
    gameLogo.style.display = 'none';
    poweredBy.style.display = 'none';
    scoreBoard.style.display = 'none';
    muteButton.style.display = 'none';

    document.getElementById('restartButton').addEventListener('click', startGame);
}

        // ==================== GAME LOOP ====================
        function gameLoop() {
            if (!gameStarted) return;

            const gradient = ctx.createLinearGradient(0, 0, 0, HEIGHT);
            gradient.addColorStop(0, '#88B5D3');
            gradient.addColorStop(1, '#C8DCE8');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            snowParticles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            eagle.update();
            terrain.update();

            for (let i = warningSigns.length - 1; i >= 0; i--) {
                warningSigns[i].update();
                if (warningSigns[i].isOffScreen()) {
                    warningSigns.splice(i, 1);
                }
            }

            coinSpawnTimer++;
            if (coinSpawnTimer > coinSpawnInterval) {
                spawnCoinRow();
                coinSpawnTimer = 0;
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].update();
                if (coins[i].isOffScreen() || coins[i].collected) {
                    coins.splice(i, 1);
                }
            }

            terrain.draw();
            
            for (let sign of warningSigns) {
                sign.draw();
            }
            
            for (let coin of coins) {
                coin.draw();
            }
            
            eagle.draw();

            if (!gameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        // ==================== MUTE BUTTON ====================
        muteButton.addEventListener('click', () => {
            isMuted = !isMuted;
            muteButton.textContent = isMuted ? '🔇' : '🔊';
            
            if (backgroundMusic) {
                if (isMuted) {
                    backgroundMusic.pause();
                    console.log('Music muted by user');
                } else if (gameStarted) {
                    console.log('User unmuted, attempting to play...');
                    backgroundMusic.play().catch(e => console.log('Play on unmute failed:', e));
                }
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && gameStarted && !isMuted && backgroundMusic && audioUnlocked) {
                if (backgroundMusic.paused) {
                    console.log('Tab visible, resuming music...');
                    backgroundMusic.play().catch(e => console.log('Resume failed:', e));
                }
            }
        });

        // ==================== START BUTTON ====================
        startButton.addEventListener('click', startGame);

        terrain.init();
    </script>
</body>
