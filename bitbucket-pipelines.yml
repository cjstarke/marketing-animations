definitions:
  caches:
    nextcache: .next/cache
  steps:
    - step: &deploy-step
        oidc: true
        caches:
          - docker
          - node
          - nextcache
        name: Deploy
        image: public.ecr.aws/converge/pipeline:v2.0.0
        artifacts:
          - test-results/**
          - playwright-report/**
        script:
          # Setup: Authentication and dependencies
          - export CODEARTIFACT_AUTH_TOKEN=`aws codeartifact get-authorization-token --domain converge --domain-owner 420280777025 --region us-east-1 --query authorizationToken --output text`
          - yarn install --frozen-lockfile

          # Install Playwright browsers and run tests (skip if [skip tests] in commit message)
          - |
            if git log -1 --pretty=%B | grep -qi '\[skip tests\]'; then
              echo "Skipping Playwright tests due to [skip tests] in commit message"
            else
              # Install Playwright browsers
              npx playwright install --with-deps chromium

              # Run tests with 2 parallel workers - now using production build via playwright config
              # Playwright config changed from 'yarn dev' to 'yarn build && npx serve@latest out -l 3000'
              PLAYWRIGHT_WORKERS=2 npx playwright test --reporter=html
            fi

          # Build the application, export to flat files
          - yarn build

          # Copy test reports to the build output directory for hosting (only if tests ran)
          - |
            if git log -1 --pretty=%B | grep -qi '\[skip tests\]'; then
              echo "Skipping test report copy (tests were skipped)"
            else
              echo "========== TEST REPORTS LS =========="
              ls -la playwright-report || echo "playwright-report directory not found"

              # Create output directory and copy reports
              mkdir -p out/tests

              # If test-reports is empty, try playwright-report (default location)
              if [ -d "playwright-report" ] && [ "$(ls -A playwright-report)" ]; then cp -r playwright-report/* out/tests/; fi

              echo "========== OUT/TESTS REPORTS LS =========="
              ls -la out/tests || echo "out/tests directory not found"
            fi

          # Environment configuration
          - eval $(bash node_modules/@converge/multi-branch-staging/scripts/ci/environment-setup.sh | grep "=" | sed 's/^/export /')

          # Infrastructure deployment
          - bash node_modules/@converge/multi-branch-staging/scripts/deploy/deploy-site.sh

          # Get CloudFront distribution ID for cache invalidation
          - eval $(bash node_modules/@converge/multi-branch-staging/scripts/utils/cloudfront-utils.sh get-id $SITE_DOMAIN | grep "DISTRIBUTION_ID=" | sed 's/^/export /')

          # Deploy site content to S3
          - pipe: atlassian/aws-s3-deploy:1.1.0
            variables:
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              AWS_OIDC_ROLE_ARN: $AWS_OIDC_ROLE_ARN
              S3_BUCKET: $SITE_DOMAIN
              LOCAL_PATH: out
              DELETE_FLAG: "true"

          # Invalidate CloudFront cache
          - pipe: atlassian/aws-cloudfront-invalidate:0.6.0
            variables:
              AWS_OIDC_ROLE_ARN: $AWS_OIDC_ROLE_ARN
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              DISTRIBUTION_ID: $DISTRIBUTION_ID
              PATHS: "/*"

          # Output site URL
          - echo "========== SITE LOCATION =========="
          - echo "https://$SITE_DOMAIN"

pipelines:
  branches:
    main:
      - step:
          <<: *deploy-step
          deployment: staging
          trigger: automatic
      - step:
          <<: *deploy-step
          deployment: production
          trigger: manual
  pull-requests:
    "**":
      - step:
          <<: *deploy-step
          deployment: test
          trigger: automatic
  custom:
    destroy_resources:
      - step:
          name: Destroy Resources
          deployment: test
          image: public.ecr.aws/converge/pipeline:v2.0.0
          caches:
            - docker
            - node
            - nextcache
          script:
            # Setup: Authentication and dependencies
            - export CODEARTIFACT_AUTH_TOKEN=`aws codeartifact get-authorization-token --domain converge --domain-owner 420280777025 --region us-east-1 --query authorizationToken --output text`
            - yarn install --frozen-lockfile
            # Debug: Check CDK versions
            - echo "========== CDK VERSION DEBUG =========="
            - npx cdk --version
            - cat node_modules/@converge/multi-branch-staging/package.json | grep -A 5 aws-cdk

            # Environment configuration
            - eval $(bash node_modules/@converge/multi-branch-staging/scripts/ci/environment-setup.sh | grep "=" | sed 's/^/export /')

            # Destroy infrastructure
            - bash node_modules/@converge/multi-branch-staging/scripts/deploy/destroy-stack.sh
          services:
            - docker